<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Favicon: a brass collar tag on a spruce ground.
       Three shapes only. An earlier version hung the tag from a separate split
       ring, which at 16px stopped reading as a tag and started reading as a
       little person — the ring became a head. The hole now sits inside the
       plate, the way it does on a real engraved tag, and the whole mark
       survives being scaled to a browser tab.
       Colours are literal: this file is served standalone, with no stylesheet. -->
  <rect width="32" height="32" rx="5" fill="#1e2a23"/>
  <rect x="8" y="4.5" width="16" height="23" rx="5" fill="#b8934c"/>
  <circle cx="16" cy="10" r="2.3" fill="#1e2a23"/>
  <rect x="11.25" y="16.75" width="9.5" height="2.1" rx="1.05" fill="#1e2a23"/>
  <rect x="12.75" y="21.25" width="6.5" height="2.1" rx="1.05" fill="#1e2a23" opacity="0.6"/>
</svg>
